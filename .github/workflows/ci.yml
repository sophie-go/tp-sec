name: "CI - Tests Automatisés avec IA"
    
on: 
  push:
    branches: 
      - sgoales
jobs:
  cypress-run:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        groups:
        - name: api
          specs: |
            cypress/tests/api/api-testdata.spec.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc" 
      - name: Cypress run (${{ matrix.groups.name }} suites) # Installe aussi les dépendances npm
        uses: cypress-io/github-action@v6
        with:
          start: npm run start
          wait-on: http://localhost:3000
          build: npm run build
      - name: Install Hurl
        run: |
          VERSION=7.1.0
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION/hurl_${VERSION}_amd64.deb
          sudo apt update && sudo apt install ./hurl_${VERSION}_amd64.deb
      - name: Run Hurl Tests
        run: hurl --test --output results.json hurl/tests/*.hurl
      - name: Upload Results
        uses: actions/upload-artifact@v5
        with:
          name: hurl-test-results
          path: results.json