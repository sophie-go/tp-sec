name: "CI - Tests Automatisés avec IA"
    
on: 
  push:
    branches: 
      - sgoales
jobs:
  cypress-run:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        groups:
        - name: ui
          specs: |
            cypress/tests/ui/user-settings.spec.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc" 
      - name: Cypress run (${{ matrix.groups.name }} suites) # Installe aussi les dépendances npm
        uses: cypress-io/github-action@v6
        with:
          start: npm run start
          wait-on: http://localhost:3000
          build: npm run build
      - name: Install Hurl
        run: |
          VERSION=7.1.0
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION/hurl_${VERSION}_amd64.deb
          sudo apt update && sudo apt install ./hurl_${VERSION}_amd64.deb
      - name: Run Hurl Tests
        run: hurl --test --output hurl/results.json hurl/tests/*.hurl
      - name: Upload Results
        uses: actions/upload-artifact@v5
        with:
          name: hurl-test-results
          path: hurl/results.json
  jmeter-run:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      - name: Download JMeter
        run: |
          wget https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "JMETER_HOME=$(pwd)/apache-jmeter-5.6.3" >> $GITHUB_ENV
      - name: Run JMeter Tests
        run: $JMETER_HOME/bin/jmeter -n -t tests/performance.jmx -l results.jtl